<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Shorts — VideoStudio AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d12;
            --panel: #12151d;
            --panel-2: #171b24;
            --border: #232838;
            --accent: #5b8cff;
            --gold: #ffd60a;
        }
        body {
            background: radial-gradient(1200px 600px at 20% -10%, #14203f 0%, var(--bg) 55%) fixed;
            color: #e7e9ee;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-glass {
            background: rgba(11, 13, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .stat-pill {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .35rem .9rem;
            font-size: .8rem;
        }
        .video-group-header {
            border-left: 3px solid var(--accent);
            padding-left: .75rem;
        }
        .short-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .short-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(0,0,0,.5);
        }
        .thumb-wrap {
            position: relative;
            aspect-ratio: 9 / 16;
            background: #000 center/cover no-repeat;
            overflow: hidden;
        }
        .thumb-wrap video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0; transition: opacity .2s ease;
        }
        .thumb-wrap:hover video { opacity: 1; }
        .badge-cat {
            position: absolute; top: 10px; left: 10px;
            font-size: .68rem; font-weight: 700; letter-spacing: .3px;
        }
        .badge-vir {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,.65); color: var(--gold);
            border-radius: 999px; padding: .15rem .5rem;
            font-size: .72rem; font-weight: 700;
        }
        .badge-dur {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,.65); color:#fff;
            border-radius: 6px; padding: .1rem .45rem; font-size: .7rem;
        }
        .play-fab {
            position: absolute; inset: 0; margin: auto;
            width: 54px; height: 54px; border-radius: 50%;
            background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.4);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.4rem; pointer-events: none;
            opacity: .85;
        }
        .short-body { padding: .85rem .9rem 1rem; display:flex; flex-direction:column; gap:.5rem; flex:1; }
        .short-title { font-size: .95rem; font-weight: 700; line-height: 1.25; margin: 0; }
        .short-desc { font-size: .8rem; color: #aab0bf; line-height: 1.35; margin: 0; }
        .tag-chips { display:flex; flex-wrap:wrap; gap:.28rem; }
        .tag-chip {
            background: var(--panel-2); border: 1px solid var(--border);
            color:#9fc0ff; border-radius: 999px; padding: .08rem .5rem; font-size: .68rem;
        }
        .card-actions { display:flex; gap:.4rem; margin-top:auto; }
        .card-actions .btn { font-size: .72rem; padding: .3rem .5rem; }
        .cat-WINNING{background:#1c7a3f!important;color:#fff}
        .cat-CLUTCH{background:#0f9d58!important;color:#fff}
        .cat-LOSING{background:#8a2b2b!important;color:#fff}
        .cat-INTENSE{background:#b5462a!important;color:#fff}
        .cat-SATISFYING{background:#2a6fb5!important;color:#fff}
        .cat-FUNNY{background:#b59a2a!important;color:#111}
        .empty-state { padding: 6rem 1rem; text-align:center; color:#7b8296; }
        .toast-copied {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1c7a3f; color:#fff; padding:.6rem 1.1rem; border-radius: 999px;
            font-size:.85rem; opacity:0; transition: opacity .2s ease; pointer-events:none; z-index: 1080;
        }
        .toast-copied.show { opacity: 1; }
    </style>
</head>
<body>
    <nav class="navbar navbar-glass sticky-top">
        <div class="container-fluid px-4 py-2 d-flex align-items-center">
            <a href="/" class="navbar-brand d-flex align-items-center gap-2 text-white mb-0">
                <i class="bi bi-stars text-primary"></i>
                <span class="fw-bold">VideoStudio AI</span>
                <span class="text-secondary fw-normal">· Generated Shorts</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="stat-pill"><i class="bi bi-collection-play me-1 text-primary"></i><span id="stat-videos">0</span> videos</span>
                <span class="stat-pill"><i class="bi bi-phone me-1 text-primary"></i><span id="stat-shorts">0</span> shorts</span>
                <a href="/" class="btn btn-sm btn-outline-light rounded-pill"><i class="bi bi-arrow-left me-1"></i>Back to editor</a>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">
        <div id="gallery-root"></div>
        <div id="empty" class="empty-state d-none">
            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
            <h5>No generated shorts yet</h5>
            <p>Upload a gameplay video and generate AI shorts — they'll show up here.</p>
            <a href="/" class="btn btn-primary rounded-pill mt-2"><i class="bi bi-upload me-1"></i>Go generate some</a>
        </div>
    </main>

    <!-- Detail modal -->
    <div class="modal fade" id="shortModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="background: var(--panel); border:1px solid var(--border);">
                <div class="modal-body p-0">
                    <div class="row g-0">
                        <div class="col-md-5 bg-black d-flex align-items-center">
                            <video id="m-video" class="w-100" style="aspect-ratio:9/16;object-fit:contain;background:#000" controls loop></video>
                        </div>
                        <div class="col-md-7 p-4">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span id="m-cat" class="badge rounded-pill">INTENSE</span>
                                <span class="badge bg-dark rounded-pill"><i class="bi bi-fire text-warning"></i> <span id="m-vir">8</span>/10</span>
                                <span class="badge bg-dark rounded-pill"><i class="bi bi-clock"></i> <span id="m-dur">0</span>s</span>
                                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"></button>
                            </div>
                            <h4 id="m-title" class="fw-bold text-white mb-1">Title</h4>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill mb-3" onclick="copyText(document.getElementById('m-title').textContent, this)"><i class="bi bi-clipboard me-1"></i>Copy title</button>

                            <label class="text-uppercase small text-muted fw-semibold">Description</label>
                            <p id="m-desc" class="text-secondary small"></p>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill mb-3" onclick="copyText(document.getElementById('m-desc').textContent, this)"><i class="bi bi-clipboard me-1"></i>Copy description</button>

                            <label class="text-uppercase small text-muted fw-semibold">Tags</label>
                            <div id="m-tags" class="tag-chips mb-2"></div>
                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="copyText(window._mTagsCsv, this)"><i class="bi bi-hash me-1"></i>Copy tags</button>
                                <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="copyText(window._mAll, this)"><i class="bi bi-clipboard-check me-1"></i>Copy all</button>
                                <a id="m-dl" href="#" download class="btn btn-sm btn-success rounded-pill"><i class="bi bi-download me-1"></i>Download</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-copied">Copied!</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const hashTag = t => { t = (t||'').toString().trim(); return t.startsWith('#') ? t : '#' + t.replace(/^#+/, ''); };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg || 'Copied!';
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
        }
        function copyText(text, btn) {
            navigator.clipboard.writeText(text || '').then(() => showToast('Copied to clipboard'));
        }

        async function load() {
            const res = await fetch('/gallery/data');
            const data = await res.json();
            document.getElementById('stat-videos').textContent = data.video_count;
            document.getElementById('stat-shorts').textContent = data.short_count;

            const root = document.getElementById('gallery-root');
            if (!data.videos.length) {
                document.getElementById('empty').classList.remove('d-none');
                return;
            }

            data.videos.forEach(v => {
                const section = document.createElement('section');
                section.className = 'mb-5';
                const header = document.createElement('div');
                header.className = 'video-group-header mb-3';
                header.innerHTML = `
                    <div class="d-flex align-items-center flex-wrap gap-2">
                        <h5 class="mb-0 text-white">${esc(v.game || 'Gameplay')}</h5>
                        <span class="badge bg-dark rounded-pill">${v.short_count} shorts</span>
                        <a href="/shorts/${esc(v.job_id)}/metadata.txt" download class="btn btn-sm btn-outline-secondary rounded-pill ms-1"><i class="bi bi-file-earmark-text me-1"></i>All metadata</a>
                    </div>
                    <div class="small text-muted">${esc(v.summary || v.filename)}</div>`;
                section.appendChild(header);

                const row = document.createElement('div');
                row.className = 'row g-3';
                v.shorts.forEach(s => row.appendChild(card(s)));
                section.appendChild(row);
                root.appendChild(section);
            });
        }

        function card(s) {
            const col = document.createElement('div');
            col.className = 'col-6 col-sm-4 col-md-3 col-xl-2';
            const cat = (s.category || 'INTENSE').toUpperCase();
            const tags = (s.tags || []).map(hashTag);
            col.innerHTML = `
                <div class="short-card">
                    <div class="thumb-wrap" style="background-image:url('${esc(s.thumbnail_url)}')">
                        <video muted loop preload="none" playsinline>
                            <source src="${esc(s.video_url)}" type="video/mp4">
                        </video>
                        <span class="badge badge-cat rounded-pill cat-${cat}">${esc(cat)}</span>
                        <span class="badge-vir"><i class="bi bi-fire"></i> ${s.virality_score}/10</span>
                        <span class="play-fab"><i class="bi bi-play-fill"></i></span>
                        <span class="badge-dur">${s.duration}s</span>
                    </div>
                    <div class="short-body">
                        <h6 class="short-title">${esc(s.title)}</h6>
                        <p class="short-desc">${esc(s.description)}</p>
                        <div class="tag-chips">${tags.slice(0,6).map(t => `<span class="tag-chip">${esc(t)}</span>`).join('')}${tags.length>6?`<span class="tag-chip">+${tags.length-6}</span>`:''}</div>
                        <div class="card-actions">
                            <button class="btn btn-outline-light rounded-pill flex-fill view-btn"><i class="bi bi-arrows-fullscreen"></i></button>
                            <button class="btn btn-outline-secondary rounded-pill flex-fill copy-btn"><i class="bi bi-clipboard-check"></i></button>
                            <a class="btn btn-success rounded-pill flex-fill" href="${esc(s.video_url)}" download><i class="bi bi-download"></i></a>
                        </div>
                    </div>
                </div>`;

            const vid = col.querySelector('video');
            const wrap = col.querySelector('.thumb-wrap');
            wrap.addEventListener('mouseenter', () => { vid.play().catch(()=>{}); });
            wrap.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });

            const tagsCsv = s.tags_csv || tags.join(', ');
            const all = `${s.title}\n\n${s.description}\n\n${tagsCsv}`;
            col.querySelector('.view-btn').addEventListener('click', () => openModal(s, tags, tagsCsv, all));
            wrap.addEventListener('click', () => openModal(s, tags, tagsCsv, all));
            col.querySelector('.copy-btn').addEventListener('click', () => copyText(all));
            return col;
        }

        function openModal(s, tags, tagsCsv, all) {
            const cat = (s.category || 'INTENSE').toUpperCase();
            document.getElementById('m-video').querySelector('source')?.remove();
            const mv = document.getElementById('m-video');
            mv.innerHTML = `<source src="${s.video_url}" type="video/mp4">`;
            mv.load();
            const mc = document.getElementById('m-cat');
            mc.textContent = cat; mc.className = `badge rounded-pill cat-${cat}`;
            document.getElementById('m-vir').textContent = s.virality_score;
            document.getElementById('m-dur').textContent = s.duration;
            document.getElementById('m-title').textContent = s.title;
            document.getElementById('m-desc').textContent = s.description;
            document.getElementById('m-tags').innerHTML = tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join('');
            document.getElementById('m-dl').href = s.video_url;
            window._mTagsCsv = tagsCsv;
            window._mAll = all;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('shortModal')).show();
        }

        load().catch(err => {
            console.error(err);
            document.getElementById('empty').classList.remove('d-none');
        });
    </script>
</body>
</html>
